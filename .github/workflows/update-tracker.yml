name: Auto Update Tracker & Sync Forms

on:
  issues:
    types: [opened]
  push:
    paths:
      - 'sources.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Updates and Rebuild Forms
        id: process
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os, json, re, sys

          event_name = os.environ.get('EVENT_NAME', '')
          title = os.environ.get('ISSUE_TITLE', '')
          body = os.environ.get('ISSUE_BODY', '').replace('\r\n', '\n')

          with open('sources.json', 'r') as f:
              data = json.load(f)

          def get_section(section_name, text):
              pattern = rf"###\s+{re.escape(section_name)}\s*\n+(.*?)(?=\n###|\Z)"
              match = re.search(pattern, text, re.DOTALL)
              return match.group(1).strip() if match else ""

          # 1. Update sources.json if triggered by an issue
          if event_name == 'issues':
              is_add = 'add game' in title.lower() or '### opponent name' in body.lower()
              is_result = 'game result' in title.lower() or 'first home goal scorer' in body.lower()
              is_payment = 'payment' in title.lower() or 'bettors paid' in body.lower()

              if not (is_add or is_result or is_payment):
                  print("Not a tracker issue. Skipping data modification.")
              else:
                  if is_add:
                      opp = get_section("Opponent Name", body)
                      dt = get_section("Game Date", body)
                      if opp and dt:
                          existing_ids = [g.get('id', 0) for g in data['games']]
                          new_id = (max(existing_ids) if existing_ids else 0) + 1
                          data['games'].append({
                              "id": new_id,
                              "opponent": opp,
                              "date": dt,
                              "goal": {"winner": None, "paid": [], "out": []},
                              "penalty": {"winner": None, "paid": [], "out": []}
                          })

                  elif is_result:
                      game_str = get_section("Select Game", body)
                      goal_w = get_section("First Home Goal Scorer", body)
                      pen_w = get_section("First Away Penalty Getter", body)

                      for gm in data['games']:
                          full_name = f"{gm['opponent']} - {gm['date']}".strip().lower()
                          if full_name == game_str.strip().lower():
                              if goal_w and "leave as is" not in goal_w.lower():
                                  gm['goal']['winner'] = goal_w
                              if pen_w and "leave as is" not in pen_w.lower():
                                  gm['penalty']['winner'] = pen_w

                  elif is_payment:
                      games_sec = get_section("Select Game(s)", body)
                      bettors_sec = get_section("Bettors Paid ($10 each)", body)

                      selected_games = [g.strip().lower() for g in re.findall(r"-\s*\[[xX]\]\s*(.+)", games_sec)]
                      selected_bettors = [b.strip() for b in re.findall(r"-\s*\[[xX]\]\s*(.+)", bettors_sec)]

                      for gm in data['games']:
                          full_name = f"{gm['opponent']} - {gm['date']}".strip().lower()
                          if full_name in selected_games:
                              for b in selected_bettors:
                                  if b not in gm['goal']['paid']:
                                      gm['goal']['paid'].append(b)
                                  if b not in gm['penalty']['paid']:
                                      gm['penalty']['paid'].append(b)

                  with open('sources.json', 'w') as f:
                      json.dump(data, f, indent=2)

          # 2. Rebuild BOTH issue templates directly from sources.json
          os.makedirs('.github/ISSUE_TEMPLATE', exist_ok=True)

          game_opts_checkbox = "\n".join([f"        - label: {g['opponent']} - {g['date']}" for g in data['games']])
          bettor_opts_checkbox = "\n".join([f"        - label: {b}" for b in sorted(data['bettors'])])
          game_opts_dropdown = "\n".join([f"        - {g['opponent']} - {g['date']}" for g in data['games']])
          bettor_opts_dropdown = "\n".join([f"        - \"{b}\"" for b in sorted(data['bettors'])])

          pay_content = (
              "name: 💵 Record Payments\n"
              "description: Record $10 payments (Goal + Penalty) for one or more games\n"
              "title: \"Payment Update: \"\n"
              "labels: [\"payment-update\"]\n"
              "body:\n"
              "  - type: checkboxes\n"
              "    id: games\n"
              "    attributes:\n"
              "      label: Select Game(s)\n"
              "      description: Check all games you are recording payment for\n"
              "      options:\n"
              + game_opts_checkbox + "\n"
              "    validations:\n"
              "      required: true\n\n"
              "  - type: checkboxes\n"
              "    id: bettors\n"
              "    attributes:\n"
              "      label: Bettors Paid ($10 each)\n"
              "      description: Check everyone who paid $10 (covers both $5 Goal and $5 Penalty)\n"
              "      options:\n"
              + bettor_opts_checkbox + "\n"
              "    validations:\n"
              "      required: true\n"
          )

          log_content = (
              "name: 🏒 Log Game Result\n"
              "description: Record the first goal scorer and first penalty getter\n"
              "title: \"Game Result: \"\n"
              "labels: [\"game-result\"]\n"
              "body:\n"
              "  - type: dropdown\n"
              "    id: game\n"
              "    attributes:\n"
              "      label: Select Game\n"
              "      options:\n"
              + game_opts_dropdown + "\n"
              "    validations:\n"
              "      required: true\n\n"
              "  - type: dropdown\n"
              "    id: goal_winner\n"
              "    attributes:\n"
              "      label: First Home Goal Scorer\n"
              "      options:\n"
              "        - \"No change / Leave as is\"\n"
              "        - \"Push\"\n"
              + bettor_opts_dropdown + "\n"
              "    validations:\n"
              "      required: true\n\n"
              "  - type: dropdown\n"
              "    id: penalty_winner\n"
              "    attributes:\n"
              "      label: First Away Penalty Getter\n"
              "      options:\n"
              "        - \"No change / Leave as is\"\n"
              "        - \"Push\"\n"
              + bettor_opts_dropdown + "\n"
              "    validations:\n"
              "      required: true\n"
          )

          with open('.github/ISSUE_TEMPLATE/record-payment.yml', 'w') as f:
              f.write(pay_content)

          with open('.github/ISSUE_TEMPLATE/log-result.yml', 'w') as f:
              f.write(log_content)

          print("Successfully regenerated and synchronized all issue templates.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json .github/ISSUE_TEMPLATE/record-payment.yml .github/ISSUE_TEMPLATE/log-result.yml
          git diff --quiet HEAD || (git commit -m "Auto-sync sources.json and issue forms [skip ci]" && git push)

      - name: Close Issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ Tracker updated and issue forms synced." || true
