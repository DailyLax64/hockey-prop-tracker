name: 💵 Record Payments
description: Record $10 payments (Goal + Penalty) for one or more games
title: "Payment Update: "
labels: ["payment-update"]
body:
  - type: checkboxes
    id: games
    attributes:
      label: Select Game(s)
      description: Check all games you are recording payment for
      options:
        - label: Ottawa - Oct 22
        - label: Kingston - Oct 22
        - label: Northumberland - Oct 23
        - label: Quinte West - Oct 23
    validations:
      required: true

  - type: checkboxes
    id: bettors
    attributes:
      label: Bettors Paid ($10 each)
      description: Check everyone who paid $10 (covers both $5 Goal and $5 Penalty)
      options:
        - label: Boonstra
        - label: Bunting
        - label: Frankland
        - label: Hryhorsky
        - label: Kenzaki
        - label: Martin
        - label: Mercanti
        - label: Merrick
        - label: Siscos
        - label: Skolnik
    validations:
      required: true
