<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Daily Degens | Hockey Prop Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      -webkit-text-size-adjust: 100%;
    }
    .neon-border {
      border: 1px solid rgba(0, 255, 0, 0.4);
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
    }
    .neon-text {
      color: #00ff00;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
    }
    .sticky-col {
      position: sticky;
      left: 0;
      z-index: 20;
    }
    .scrollbar-thin::-webkit-scrollbar {
      height: 6px;
    }
    .scrollbar-thin::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans min-h-screen flex flex-col p-3 sm:p-6 antialiased selection:bg-fuchsia-500 selection:text-white">

  <div class="max-w-6xl w-full mx-auto flex-grow flex flex-col">
    <!-- Header with Daily Degens pill logo -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-5 pb-4 border-b border-neutral-800 gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-r from-cyan-400 to-fuchsia-500 text-neutral-950 font-black px-4 py-2 rounded-lg text-xl sm:text-2xl tracking-tight uppercase shadow-lg transform -skew-x-6 flex items-baseline select-none">
          Daily Degens<span class="lowercase text-sm font-bold opacity-80 tracking-normal ml-0.5">.ca</span>
        </div>
        <div class="text-right flex flex-col justify-center">
          <span class="text-xs font-black tracking-widest text-fuchsia-400 uppercase leading-none">Prop Ledger</span>
          <div class="flex items-center space-x-1.5 mt-1 justify-end">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-lime-500"></span>
            </span>
            <span class="text-[11px] text-lime-400 font-mono tracking-widest uppercase">Live Tracking</span>
          </div>
        </div>
      </div>
      
      <!-- Legend -->
      <div class="flex flex-wrap items-center justify-center gap-3 bg-neutral-900 border border-neutral-800 px-4 py-2.5 rounded-xl text-xs font-mono shadow-sm">
        <span class="flex items-center gap-1.5"><span class="text-base opacity-40">💵</span> <span class="text-neutral-300">Paid ($5)</span></span>
        <span class="text-neutral-700">|</span>
        <span class="flex items-center gap-1.5"><span class="text-xl drop-shadow-[0_0_8px_rgba(0,255,0,0.8)]">💰</span> <span class="text-neutral-100 font-bold">Winner</span></span>
        <span class="text-neutral-700">|</span>
        <span class="flex items-center gap-1.5"><span class="text-[10px] text-rose-400 border border-rose-900/60 bg-rose-950/60 px-1.5 py-0.5 rounded font-black">OUT</span> <span class="text-neutral-300">Opted Out</span></span>
      </div>
    </header>

    <!-- Game Navigation Bar -->
    <div class="flex items-center justify-between bg-neutral-900 border border-neutral-800 px-3.5 py-2.5 rounded-xl mb-3 text-xs sm:text-sm font-mono shadow-md">
      <button id="prevGamesBtn" onclick="shiftGames(-1)" class="px-3.5 py-2 rounded-lg bg-neutral-950 border border-neutral-800 text-cyan-400 font-bold hover:bg-neutral-800 disabled:opacity-20 disabled:cursor-not-allowed flex items-center gap-1 transition-all">
        <span>◀</span> <span class="hidden sm:inline">Older Games</span>
      </button>
      <div id="gameRangeDisplay" class="text-xs sm:text-sm text-neutral-300 font-bold uppercase tracking-wider text-center">
        Loading Games...
      </div>
      <button id="nextGamesBtn" onclick="shiftGames(1)" class="px-3.5 py-2 rounded-lg bg-neutral-950 border border-neutral-800 text-cyan-400 font-bold hover:bg-neutral-800 disabled:opacity-20 disabled:cursor-not-allowed flex items-center gap-1 transition-all">
        <span class="hidden sm:inline">Newer Games</span> <span>▶</span>
      </button>
    </div>

    <!-- Table Container -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-2xl flex-grow flex flex-col mb-6">
      <div class="overflow-x-auto scrollbar-thin flex-grow">
        <table class="w-full border-collapse text-left whitespace-nowrap" id="trackerTable">
          <thead id="tableHead" class="bg-neutral-950 border-b border-neutral-800 text-neutral-300 font-mono"></thead>
          <tbody id="tableBody" class="divide-y divide-neutral-800/60 font-mono"></tbody>
        </table>
      </div>
    </div>

    <!-- Leaderboard -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 sm:p-5 shadow-xl mb-6">
      <div class="flex items-center justify-between border-b border-neutral-800 pb-3 mb-4">
        <h3 class="text-xs sm:text-sm font-black uppercase tracking-widest text-fuchsia-400 flex items-center gap-2">
          <span>🏆</span> Top 3 Winnings Leaderboard
        </h3>
        <span class="text-xs font-mono text-neutral-500 uppercase tracking-widest">Season Standings</span>
      </div>
      <div id="leaderboardList" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs font-mono text-neutral-600 uppercase tracking-wider py-2">
      Daily Degens Prop Matrix &bull; Real-Time Ledger Feed
    </footer>
  </div>

  <script>
    let trackerData = null;
    let windowStart = 0;
    const MAX_VISIBLE = 5;

    async function init() {
      try {
        const res = await fetch('./sources.json?t=' + Date.now());
        if (!res.ok) throw new Error('Could not load sources.json');
        trackerData = await res.json();
        windowStart = Math.max(0, trackerData.games.length - MAX_VISIBLE);
        renderTracker();
      } catch (err) {
        console.error(err);
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="10" class="p-8 text-center text-rose-500 text-sm">Failed to load sources.json. Confirm file exists.</td></tr>`;
      }
    }

    function shiftGames(delta) {
      if (!trackerData) return;
      const maxStart = Math.max(0, trackerData.games.length - MAX_VISIBLE);
      windowStart = Math.max(0, Math.min(maxStart, windowStart + delta));
      renderTracker();
    }

    function renderTracker() {
      const data = trackerData;
      const sortedBettors = [...data.bettors].sort((a, b) => a.localeCompare(b));

      let goalRollover = 0;
      let penaltyRollover = 0;
      let goalCascadingTBD = false;
      let penaltyCascadingTBD = false;

      // 1. Calculate pots across ALL games sequentially
      const computedPots = data.games.map((game, idx) => {
        const goalOutCount = (game.goal.out || []).length;
        const penaltyOutCount = (game.penalty.out || []).length;
        const baseGoalPot = (data.bettors.length - goalOutCount) * 5;
        const basePenaltyPot = (data.bettors.length - penaltyOutCount) * 5;

        let goalPotDisplay = "TBD";
        let penaltyPotDisplay = "TBD";
        let isGoalRoll = false;
        let isPenaltyRoll = false;

        if (idx === 0) {
          const currentGoalPot = baseGoalPot + goalRollover;
          goalPotDisplay = `$${currentGoalPot}`;
          if (game.goal.winner === "Push") goalRollover = currentGoalPot;
          else if (game.goal.winner === null) goalCascadingTBD = true;
          else goalRollover = 0;
        } else {
          if (!goalCascadingTBD) {
            const currentGoalPot = baseGoalPot + goalRollover;
            goalPotDisplay = `$${currentGoalPot}`;
            isGoalRoll = goalRollover > 0;
            if (game.goal.winner === "Push") goalRollover = currentGoalPot;
            else if (game.goal.winner === null) goalCascadingTBD = true;
            else goalRollover = 0;
          }
        }

        if (idx === 0) {
          const currentPenaltyPot = basePenaltyPot + penaltyRollover;
          penaltyPotDisplay = `$${currentPenaltyPot}`;
          if (game.penalty.winner === "Push") penaltyRollover = currentPenaltyPot;
          else if (game.penalty.winner === null) penaltyCascadingTBD = true;
          else penaltyRollover = 0;
        } else {
          if (!penaltyCascadingTBD) {
            const currentPenaltyPot = basePenaltyPot + penaltyRollover;
            penaltyPotDisplay = `$${currentPenaltyPot}`;
            isPenaltyRoll = penaltyRollover > 0;
            if (game.penalty.winner === "Push") penaltyRollover = currentPenaltyPot;
            else if (game.penalty.winner === null) penaltyCascadingTBD = true;
            else penaltyRollover = 0;
          }
        }

        return { goalPot: goalPotDisplay, penaltyPot: penaltyPotDisplay, isGoalRoll, isPenaltyRoll };
      });

      // 2. Slice window (max 5 games)
      const totalGames = data.games.length;
      const visibleGames = data.games.slice(windowStart, windowStart + MAX_VISIBLE);
      const visiblePots = computedPots.slice(windowStart, windowStart + MAX_VISIBLE);

      const prevBtn = document.getElementById('prevGamesBtn');
      const nextBtn = document.getElementById('nextGamesBtn');
      const rangeDisp = document.getElementById('gameRangeDisplay');

      prevBtn.disabled = (windowStart <= 0);
      nextBtn.disabled = (windowStart >= totalGames - MAX_VISIBLE || totalGames <= MAX_VISIBLE);

      if (totalGames === 0) {
        rangeDisp.innerText = 'No Games Scheduled';
      } else {
        const startNum = windowStart + 1;
        const endNum = Math.min(windowStart + MAX_VISIBLE, totalGames);
        rangeDisp.innerHTML = `Showing Games <span class="text-cyan-400 font-black">${startNum}–${endNum}</span> of <span class="text-white">${totalGames}</span>`;
      }

      // 3. Render Table Head with larger responsive text
      let headHTML = `
        <tr>
          <th rowspan="2" class="py-3.5 px-3 sm:px-4 text-center font-black border-r border-neutral-800 bg-neutral-950 sticky-col min-w-[130px] sm:min-w-[160px] text-xs sm:text-sm text-neutral-200 shadow-md">
            Bettor
          </th>`;
      visibleGames.forEach(game => {
        headHTML += `
          <th colspan="2" class="py-3 px-3 text-center border-b border-r border-neutral-800 uppercase tracking-widest text-xs sm:text-sm font-black bg-neutral-950 text-cyan-400">
            ${game.opponent} <span class="text-neutral-400 font-normal text-[11px] sm:text-xs">(${game.date})</span>
          </th>`;
      });
      headHTML += `</tr><tr>`;
      visibleGames.forEach((game, idx) => {
        const pots = visiblePots[idx];
        const goalClass = pots.isGoalRoll ? "neon-text font-black text-xs sm:text-sm" : "text-neutral-200 font-bold text-xs";
        const penaltyClass = pots.isPenaltyRoll ? "neon-text font-black text-xs sm:text-sm" : "text-neutral-200 font-bold text-xs";
        headHTML += `
          <th class="py-2.5 px-2 text-center border-r border-neutral-800 text-xs bg-neutral-900/95 font-semibold text-neutral-400 min-w-[70px] sm:min-w-[85px]">
            Goal <span class="${goalClass} block mt-0.5">(${pots.goalPot})</span>
          </th>
          <th class="py-2.5 px-2 text-center border-r border-neutral-800 text-xs bg-neutral-900/95 font-semibold text-neutral-400 min-w-[70px] sm:min-w-[85px]">
            Penalty <span class="${penaltyClass} block mt-0.5">(${pots.penaltyPot})</span>
          </th>`;
      });
      headHTML += `</tr>`;
      document.getElementById('tableHead').innerHTML = headHTML;

      // 4. Render Table Body with legible sizes and no over-truncation
      let bodyHTML = '';
      sortedBettors.forEach((bettor, index) => {
        bodyHTML += `
          <tr class="hover:bg-neutral-800/30 transition-colors">
            <td class="py-3.5 px-3 sm:px-4 font-black border-r border-neutral-800 bg-neutral-950 sticky-col flex items-center justify-between text-neutral-100 text-xs sm:text-sm shadow-md">
              <span class="truncate max-w-[100px] sm:max-w-none">${bettor}</span>
              <span class="text-xs text-neutral-600 font-mono ml-2 font-normal">#${index + 1}</span>
            </td>`;

        visibleGames.forEach(game => {
          bodyHTML += renderCell(game.goal, bettor);
          bodyHTML += renderCell(game.penalty, bettor);
        });
        bodyHTML += `</tr>`;
      });
      document.getElementById('tableBody').innerHTML = bodyHTML;

      // 5. Render Leaderboard
      const winningsMap = {};
      sortedBettors.forEach(b => winningsMap[b] = 0);
      data.games.forEach((game, idx) => {
        const pots = computedPots[idx];
        if (game.goal.winner && game.goal.winner !== "Push" && winningsMap[game.goal.winner] !== undefined) {
          const val = parseInt(pots.goalPot.replace('$', '')) || 0;
          winningsMap[game.goal.winner] += val;
        }
        if (game.penalty.winner && game.penalty.winner !== "Push" && winningsMap[game.penalty.winner] !== undefined) {
          const val = parseInt(pots.penaltyPot.replace('$', '')) || 0;
          winningsMap[game.penalty.winner] += val;
        }
      });

      const sortedWinners = Object.entries(winningsMap)
        .map(([name, total]) => ({ name, total }))
        .sort((a, b) => b.total - a.total);

      let lbHTML = '';
      const top3 = sortedWinners.slice(0, 3);
      const badges = ['🥇', '🥈', '🥉'];
      const borderColors = ['border-amber-500/40 bg-amber-950/20', 'border-neutral-400/40 bg-neutral-900/40', 'border-amber-700/40 bg-amber-950/10'];

      top3.forEach((player, i) => {
        lbHTML += `
          <div class="border ${borderColors[i]} rounded-xl p-3.5 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
              <span class="text-2xl">${badges[i]}</span>
              <div>
                <span class="block text-xs sm:text-sm font-black uppercase text-white tracking-wider">${player.name}</span>
                <span class="text-xs font-mono text-neutral-400">Rank #${i + 1}</span>
              </div>
            </div>
            <div class="text-right">
              <span class="text-lg sm:text-xl font-black font-mono text-lime-400">$${player.total}</span>
            </div>
          </div>`;
      });
      document.getElementById('leaderboardList').innerHTML = lbHTML;
    }

    function renderCell(category, bettor) {
      const isWinner = category.winner === bettor;
      const isPaid = (category.paid || []).includes(bettor);
      const isOut = (category.out || []).includes(bettor);

      let content = '<span class="text-neutral-700 text-sm font-bold">•</span>';
      let cellBg = '';

      if (isOut) {
        content = '<span class="text-[10px] text-rose-400 border border-rose-900/60 bg-rose-950/60 px-1.5 py-0.5 rounded font-black tracking-tight select-none">OUT</span>';
      } else if (isWinner) {
        content = '<span class="text-3xl leading-none drop-shadow-[0_0_12px_rgba(0,255,0,0.9)] animate-pulse inline-block" title="Winner!">💰</span>';
        cellBg = 'bg-lime-950/40';
      } else if (isPaid) {
        content = '<span class="text-base opacity-40 hover:opacity-100 transition-opacity" title="Paid">💵</span>';
      }

      return `<td class="py-3 px-2 text-center border-r border-neutral-800/80 min-w-[70px] sm:min-w-[85px] ${cellBg}">${content}</td>`;
    }

    init();
  </script>
</body>
</html>
